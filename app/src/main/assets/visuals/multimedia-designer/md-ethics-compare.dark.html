<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>多媒体行业职业道德要点</title>
<style>
:root {
  --bg: #12161C;
  --panel: #1C222C;
  --panel2: #262E3A;
  --line: #394455;
  --text: #E8EEF6;
  --muted: #9BA9BC;
  --primary: #7FA5FF;
  --on-primary: #0B1017;
  --accent: #33D3BC;
  --on-accent: #07201D;
  --warn: #FFB15C;
  --on-warn: #2A1804;
  --danger: #FF7276;
  --on-danger: #2B0709;
  --c0: #7FA5FF;
  --c1: #33D3BC;
  --c2: #B49BFF;
  --c3: #FFB15C;
  --c4: #FF7276;
  --c5: #59C7E8;
  --c6: #D9BC72;
  --c7: #A6B8FF;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC",
               "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  display: flex; flex-direction: column;
}
.wrap { display: flex; flex-direction: column; height: 100%; }
.head { padding: 10px 14px 4px 14px; }
.title {
  font-size: 15px; font-weight: 700; line-height: 1.35; color: var(--text);
}
.cap {
  font-size: 11.5px; line-height: 1.5; color: var(--muted); margin-top: 3px;
}
.stage { flex: 1 1 auto; min-height: 0; position: relative; }
.stage svg { display: block; width: 100%; height: 100%; }
.bar {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 14px 8px 14px;
}
.bar .sp { flex: 1 1 auto; }
.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 999px; padding: 4px 12px; font-size: 11.5px; line-height: 1.6;
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
}
.btn:active { background: var(--panel2); }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line); transition: background .25s, transform .25s;
}
.dot.on { background: var(--primary); transform: scale(1.35); }

/* 通用图元 */
.lbl  { font-size: 12px; font-weight: 600; fill: var(--text); }
.lbl-s{ font-size: 10.5px; font-weight: 500; fill: var(--muted); }
.lbl-w{ font-size: 12px; font-weight: 700; fill: var(--on-primary); }
.num  { font-size: 10px; font-weight: 700; fill: var(--muted); }
.card { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.card2{ fill: var(--panel2); stroke: var(--line); stroke-width: 1; }
.edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
.dash { stroke-dasharray: 5 5; animation: dash 1.1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }
.hit  { fill: transparent; }

.c0 { fill: var(--c0); } .s0 { stroke: var(--c0); }
.c1 { fill: var(--c1); } .s1 { stroke: var(--c1); }
.c2 { fill: var(--c2); } .s2 { stroke: var(--c2); }
.c3 { fill: var(--c3); } .s3 { stroke: var(--c3); }
.c4 { fill: var(--c4); } .s4 { stroke: var(--c4); }
.c5 { fill: var(--c5); } .s5 { stroke: var(--c5); }
.c6 { fill: var(--c6); } .s6 { stroke: var(--c6); }
.c7 { fill: var(--c7); } .s7 { stroke: var(--c7); }
.on0 { fill: var(--on-primary); }

/* 逐个淡入（通用） */
.fade { animation: fade .45s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; transform-box: fill-box;
       transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: scale(1); } }

.drop { animation: drop .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }

.rise { animation: rise .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.slideL { animation: slideL .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes slideL { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }

.slideR { animation: slideR .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes slideR { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

.draw { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000);
        animation: draw .9s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.grow { animation: grow .8s cubic-bezier(.2,.85,.3,1.05) both; transform-box: fill-box;
        transform-origin: left center; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.growv { animation: growv .8s cubic-bezier(.2,.85,.3,1.05) both; transform-box: fill-box;
         transform-origin: bottom center; }
@keyframes growv { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.spin { animation: spin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }

.sweep { animation: sweep 3.2s ease-in-out infinite; }
@keyframes sweep {
  0%   { transform: translateY(0); opacity: 0; }
  12%  { opacity: .55; }
  70%  { opacity: .35; }
  100% { transform: translateY(150px); opacity: 0; }
}

.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

.glow { animation: glow 2.2s ease-in-out infinite; }
@keyframes glow {
  0%,100% { stroke-opacity: .35; stroke-width: 1.6; }
  50%     { stroke-opacity: 1; stroke-width: 3; }
}

.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

.flip { animation: flip .7s ease both; transform-box: fill-box; transform-origin: center; }
@keyframes flip { from { opacity: 0; transform: rotateX(-70deg) scale(.9); }
                  to { opacity: 1; transform: none; } }

body.paused * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .001s !important; } }

</style></head>
<body>
<div class="wrap"><div class="head"><div class="title">多媒体行业职业道德要点</div><div class="cap">版权意识与内容安全是多媒体从业者的两条红线。</div></div><div class="stage"><svg viewBox="-10.0 -10.0 380.0 200.0" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><g class="rise" style="animation-delay:0.08s"><rect x="8.0" y="26" width="79.2" height="142.0" rx="10" class="card"/><rect x="8.0" y="26" width="79.2" height="26" rx="10" class="c0"/><rect x="8.0" y="42" width="79.2" height="10" class="c0"/><text class="on0" x="47.6" y="44" text-anchor="middle" style="font-size:11.5px;font-weight:700">专业能力</text></g><g class="fade" style="animation-delay:0.30s"><circle cx="17.0" cy="64.0" r="3" class="c0"/><text class="lbl-s" x="26.0" y="68" text-anchor="start">掌握主流工</text><text class="lbl-s" x="26.0" y="80" text-anchor="start">具与规范</text></g><g class="fade" style="animation-delay:0.37s"><circle cx="17.0" cy="96.0" r="3" class="c0"/><text class="lbl-s" x="26.0" y="100" text-anchor="start">持续学习新</text><text class="lbl-s" x="26.0" y="112" text-anchor="start">技术</text></g><g class="fade" style="animation-delay:0.44s"><circle cx="17.0" cy="128.0" r="3" class="c0"/><text class="lbl-s" x="26.0" y="132" text-anchor="start">规范设计文</text><text class="lbl-s" x="26.0" y="144" text-anchor="start">档</text></g><g class="rise" style="animation-delay:0.22s"><rect x="96.2" y="26" width="79.2" height="142.0" rx="10" class="card"/><rect x="96.2" y="26" width="79.2" height="26" rx="10" class="c3"/><rect x="96.2" y="42" width="79.2" height="10" class="c3"/><text class="on0" x="135.9" y="44" text-anchor="middle" style="font-size:11.5px;font-weight:700">版权意识</text></g><g class="fade" style="animation-delay:0.42s"><circle cx="105.2" cy="64.0" r="3" class="c3"/><text class="lbl-s" x="114.25" y="68" text-anchor="start">使用授权素</text><text class="lbl-s" x="114.25" y="80" text-anchor="start">材</text></g><g class="fade" style="animation-delay:0.49s"><circle cx="105.2" cy="96.0" r="3" class="c3"/><text class="lbl-s" x="114.25" y="100" text-anchor="start">标注素材来</text><text class="lbl-s" x="114.25" y="112" text-anchor="start">源</text></g><g class="fade" style="animation-delay:0.56s"><circle cx="105.2" cy="128.0" r="3" class="c3"/><text class="lbl-s" x="114.25" y="132" text-anchor="start">尊重作者署</text><text class="lbl-s" x="114.25" y="144" text-anchor="start">名权</text></g><g class="rise" style="animation-delay:0.36s"><rect x="184.5" y="26" width="79.2" height="142.0" rx="10" class="card"/><rect x="184.5" y="26" width="79.2" height="26" rx="10" class="c1"/><rect x="184.5" y="42" width="79.2" height="10" class="c1"/><text class="on0" x="224.1" y="44" text-anchor="middle" style="font-size:11.5px;font-weight:700">职业道德</text></g><g class="fade" style="animation-delay:0.54s"><circle cx="193.5" cy="64.0" r="3" class="c1"/><text class="lbl-s" x="202.5" y="68" text-anchor="start">不剽窃他人</text><text class="lbl-s" x="202.5" y="80" text-anchor="start">作品</text></g><g class="fade" style="animation-delay:0.61s"><circle cx="193.5" cy="96.0" r="3" class="c1"/><text class="lbl-s" x="202.5" y="100" text-anchor="start">不制作违规</text><text class="lbl-s" x="202.5" y="112" text-anchor="start">内容</text></g><g class="fade" style="animation-delay:0.68s"><circle cx="193.5" cy="128.0" r="3" class="c1"/><text class="lbl-s" x="202.5" y="132" text-anchor="start">保护客户资</text><text class="lbl-s" x="202.5" y="144" text-anchor="start">料</text></g><g class="rise" style="animation-delay:0.50s"><rect x="272.8" y="26" width="79.2" height="142.0" rx="10" class="card"/><rect x="272.8" y="26" width="79.2" height="26" rx="10" class="c2"/><rect x="272.8" y="42" width="79.2" height="10" class="c2"/><text class="on0" x="312.4" y="44" text-anchor="middle" style="font-size:11.5px;font-weight:700">团队协作</text></g><g class="fade" style="animation-delay:0.66s"><circle cx="281.8" cy="64.0" r="3" class="c2"/><text class="lbl-s" x="290.75" y="68" text-anchor="start">按规范交接</text></g><g class="fade" style="animation-delay:0.73s"><circle cx="281.8" cy="90.0" r="3" class="c2"/><text class="lbl-s" x="290.75" y="94" text-anchor="start">客观评审</text></g><g class="fade" style="animation-delay:0.80s"><circle cx="281.8" cy="116.0" r="3" class="c2"/><text class="lbl-s" x="290.75" y="120" text-anchor="start">承担岗位责</text><text class="lbl-s" x="290.75" y="132" text-anchor="start">任</text></g></svg></div><div class="bar"><div class="steps"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="sp"></div><span class="btn" id="play">暂停</span><span class="btn" id="replay">重播</span></div></div>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var body = document.body;
  var btn = document.getElementById('play');
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));

  function replay() {
    // 复制一份节点，强制重启动画
    var clone = stage.cloneNode(true);
    stage.parentNode.replaceChild(clone, stage);
    stage = clone;
    bind();
    body.classList.remove('paused');
    if (btn) btn.textContent = '暂停';
    mark(0);
  }

  function bind() {
    if (!btn) return;
    btn.onclick = function () {
      var paused = body.classList.toggle('paused');
      btn.textContent = paused ? '播放' : '暂停';
    };
  }

  function mark(i) {
    dots.forEach(function (d, k) { d.classList.toggle('on', k === i); });
  }

  if (dots.length) {
    var step = Math.max(1200, Math.round(dots.length * 900));
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % dots.length;
      mark(idx);
    }, step);
  }

  var rb = document.getElementById('replay');
  if (rb) rb.onclick = replay;

  bind();
})();
</script>
</body></html>
