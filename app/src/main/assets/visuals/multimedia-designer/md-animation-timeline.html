<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>动画的帧序列</title>
<style>
:root {
  --bg: #FFFFFF;
  --panel: #F1F5FB;
  --panel2: #E2EAF6;
  --line: #C6D4E9;
  --text: #16202E;
  --muted: #46586E;
  --primary: #2F6BFF;
  --on-primary: #FFFFFF;
  --accent: #00A08F;
  --on-accent: #FFFFFF;
  --warn: #E97C10;
  --on-warn: #FFFFFF;
  --danger: #D93F45;
  --on-danger: #FFFFFF;
  --c0: #2F6BFF;
  --c1: #00A08F;
  --c2: #7A5AF8;
  --c3: #E97C10;
  --c4: #D93F45;
  --c5: #1F93B8;
  --c6: #8A6A2F;
  --c7: #4C6EF5;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC",
               "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  display: flex; flex-direction: column;
}
/* 注意：这里不能用 height:100% 的链式高度。
   Android WebView 里 flex 容器分不到确定高度时，SVG 的 height:100% 会塌成 0，
   整张图就看不见了（标题和底栏还在，图不见了）。
   改成 min-height + height:auto，SVG 按 viewBox 的固有比例随宽度缩放，任何环境都稳。 */
.wrap { display: flex; flex-direction: column; min-height: 100vh; }
.head { padding: 10px 14px 4px 14px; }
.title {
  font-size: 17px; font-weight: 700; line-height: 1.35; color: var(--text);
}
.cap {
  font-size: 12.5px; line-height: 1.5; color: var(--muted); margin-top: 3px;
}
.stage { flex: 1 1 auto; min-height: 200px; position: relative;
         display: flex; align-items: center; justify-content: center; }
.stage svg { display: block; width: 100%; height: auto; }
.bar {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 14px 8px 14px;
}
.bar .sp { flex: 1 1 auto; }
.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 999px; padding: 4px 12px; font-size: 12px; line-height: 1.6;
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
}
.btn:active { background: var(--panel2); }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line); transition: background .25s, transform .25s;
}
.dot.on { background: var(--primary); transform: scale(1.35); }

/* 通用图元。字号是 fit_viewbox 估宽的兜底依据：改这里要同步改 CLASS_FONT。 */
.lbl  { font-size: 13.5px; font-weight: 600; fill: var(--text); }
.lbl-s{ font-size: 11.5px; font-weight: 500; fill: var(--muted); }
.lbl-w{ font-size: 13.5px; font-weight: 700; fill: var(--on-primary); }
.num  { font-size: 11px; font-weight: 700; fill: var(--muted); }
.card { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.card2{ fill: var(--panel2); stroke: var(--line); stroke-width: 1; }
.edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
.dash { stroke-dasharray: 5 5; animation: dash 1.1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }
.hit  { fill: transparent; }

.c0 { fill: var(--c0); } .s0 { stroke: var(--c0); }
.c1 { fill: var(--c1); } .s1 { stroke: var(--c1); }
.c2 { fill: var(--c2); } .s2 { stroke: var(--c2); }
.c3 { fill: var(--c3); } .s3 { stroke: var(--c3); }
.c4 { fill: var(--c4); } .s4 { stroke: var(--c4); }
.c5 { fill: var(--c5); } .s5 { stroke: var(--c5); }
.c6 { fill: var(--c6); } .s6 { stroke: var(--c6); }
.c7 { fill: var(--c7); } .s7 { stroke: var(--c7); }
.on0 { fill: var(--on-primary); }

/* 逐个淡入（通用） */
.fade { animation: fade .45s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; transform-box: fill-box;
       transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: scale(1); } }

.drop { animation: drop .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }

.rise { animation: rise .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.slideL { animation: slideL .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes slideL { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }

.slideR { animation: slideR .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes slideR { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

.draw { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000);
        animation: draw .9s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.grow { animation: grow .8s cubic-bezier(.2,.85,.3,1.05) both; transform-box: fill-box;
        transform-origin: left center; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.growv { animation: growv .8s cubic-bezier(.2,.85,.3,1.05) both; transform-box: fill-box;
         transform-origin: bottom center; }
@keyframes growv { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.spin { animation: spin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }

.sweep { animation: sweep 3.2s ease-in-out infinite; }
@keyframes sweep {
  0%   { transform: translateY(0); opacity: 0; }
  12%  { opacity: .55; }
  70%  { opacity: .35; }
  100% { transform: translateY(150px); opacity: 0; }
}

.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

.glow { animation: glow 2.2s ease-in-out infinite; }
@keyframes glow {
  0%,100% { stroke-opacity: .35; stroke-width: 1.6; }
  50%     { stroke-opacity: 1; stroke-width: 3; }
}

.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

.flip { animation: flip .7s ease both; transform-box: fill-box; transform-origin: center; }
@keyframes flip { from { opacity: 0; transform: rotateX(-70deg) scale(.9); }
                  to { opacity: 1; transform: none; } }

body.paused * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .001s !important; } }

</style></head>
<body>
<div class="wrap"><div class="head"><div class="title">动画的帧序列</div><div class="cap">动画 = 连续帧；帧率决定流畅度，帧数决定时长，关键帧决定运动轨迹。</div></div><div class="stage"><svg viewBox="-10.0 -10.0 380.0 210.0" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><line x1="18" y1="92" x2="342" y2="92" class="edge"/><line x1="18" y1="92" x2="342" y2="92" class="edge s0" stroke-width="2.5" style="--len:324" stroke-dasharray="324" stroke-dashoffset="324"><animate attributeName="stroke-dashoffset" from="324" to="0" dur="1.2s" fill="freeze"/></line><g class="pop" style="animation-delay:0.35s"><circle cx="58.5" cy="92" r="7" class="c0"/><circle cx="58.5" cy="92" r="11" class="s0" fill="none" style="opacity:.35"><animate attributeName="r" values="11;17;11" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="2.4s" repeatCount="indefinite"/></circle><line x1="58.5" y1="85" x2="58.5" y2="76" class="edge"/><text class="lbl" x="58.5" y="48" text-anchor="middle" style="font-size:12px">第 1 帧</text></g><text class="lbl-s" x="58.5" y="62" text-anchor="middle">起始关键帧</text><g class="pop" style="animation-delay:0.51s"><circle cx="139.5" cy="92" r="7" class="c1"/><circle cx="139.5" cy="92" r="11" class="s1" fill="none" style="opacity:.35"><animate attributeName="r" values="11;17;11" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="2.4s" repeatCount="indefinite"/></circle><line x1="139.5" y1="99" x2="139.5" y2="108" class="edge"/><text class="lbl" x="139.5" y="120" text-anchor="middle" style="font-size:12px">中间帧</text></g><text class="lbl-s" x="139.5" y="134" text-anchor="middle">插值生成</text><g class="pop" style="animation-delay:0.67s"><circle cx="220.5" cy="92" r="7" class="c2"/><circle cx="220.5" cy="92" r="11" class="s2" fill="none" style="opacity:.35"><animate attributeName="r" values="11;17;11" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="2.4s" repeatCount="indefinite"/></circle><line x1="220.5" y1="85" x2="220.5" y2="76" class="edge"/><text class="lbl" x="220.5" y="48" text-anchor="middle" style="font-size:12px">第 N 帧</text></g><text class="lbl-s" x="220.5" y="62" text-anchor="middle">结束关键帧</text><g class="pop" style="animation-delay:0.83s"><circle cx="301.5" cy="92" r="7" class="c3"/><circle cx="301.5" cy="92" r="11" class="s3" fill="none" style="opacity:.35"><animate attributeName="r" values="11;17;11" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".35;0;.35" dur="2.4s" repeatCount="indefinite"/></circle><line x1="301.5" y1="99" x2="301.5" y2="108" class="edge"/><text class="lbl" x="301.5" y="120" text-anchor="middle" style="font-size:12px">循环播放</text></g><text class="lbl-s" x="301.5" y="134" text-anchor="middle">帧序列重复</text></svg></div><div class="bar"><div class="steps"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="sp"></div><span class="btn" id="play">暂停</span><span class="btn" id="replay">重播</span></div></div>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var body = document.body;
  var btn = document.getElementById('play');
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));

  function replay() {
    // 复制一份节点，强制重启动画
    var clone = stage.cloneNode(true);
    stage.parentNode.replaceChild(clone, stage);
    stage = clone;
    bind();
    body.classList.remove('paused');
    if (btn) btn.textContent = '暂停';
    mark(0);
  }

  function bind() {
    if (!btn) return;
    btn.onclick = function () {
      var paused = body.classList.toggle('paused');
      btn.textContent = paused ? '播放' : '暂停';
    };
  }

  function mark(i) {
    dots.forEach(function (d, k) { d.classList.toggle('on', k === i); });
  }

  if (dots.length) {
    var step = Math.max(1200, Math.round(dots.length * 900));
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % dots.length;
      mark(idx);
    }, step);
  }

  var rb = document.getElementById('replay');
  if (rb) rb.onclick = replay;

  bind();
})();
</script>
</body></html>
