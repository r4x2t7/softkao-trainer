<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>风险概率–影响矩阵</title>
<style>
:root {
  --bg: #12161C;
  --panel: #1C222C;
  --panel2: #262E3A;
  --line: #394455;
  --text: #E8EEF6;
  --muted: #9BA9BC;
  --primary: #7FA5FF;
  --on-primary: #0B1017;
  --accent: #33D3BC;
  --on-accent: #07201D;
  --warn: #FFB15C;
  --on-warn: #2A1804;
  --danger: #FF7276;
  --on-danger: #2B0709;
  --c0: #7FA5FF;
  --c1: #33D3BC;
  --c2: #B49BFF;
  --c3: #FFB15C;
  --c4: #FF7276;
  --c5: #59C7E8;
  --c6: #D9BC72;
  --c7: #A6B8FF;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC",
               "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  display: flex; flex-direction: column;
}
.wrap { display: flex; flex-direction: column; height: 100%; }
.head { padding: 10px 14px 4px 14px; }
.title {
  font-size: 15px; font-weight: 700; line-height: 1.35; color: var(--text);
}
.cap {
  font-size: 11.5px; line-height: 1.5; color: var(--muted); margin-top: 3px;
}
.stage { flex: 1 1 auto; min-height: 0; position: relative; }
.stage svg { display: block; width: 100%; height: 100%; }
.bar {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 14px 8px 14px;
}
.bar .sp { flex: 1 1 auto; }
.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 999px; padding: 4px 12px; font-size: 11.5px; line-height: 1.6;
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
}
.btn:active { background: var(--panel2); }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line); transition: background .25s, transform .25s;
}
.dot.on { background: var(--primary); transform: scale(1.35); }

/* 通用图元 */
.lbl  { font-size: 12px; font-weight: 600; fill: var(--text); }
.lbl-s{ font-size: 10.5px; font-weight: 500; fill: var(--muted); }
.lbl-w{ font-size: 12px; font-weight: 700; fill: var(--on-primary); }
.num  { font-size: 10px; font-weight: 700; fill: var(--muted); }
.card { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.card2{ fill: var(--panel2); stroke: var(--line); stroke-width: 1; }
.edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
.dash { stroke-dasharray: 5 5; animation: dash 1.1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }
.hit  { fill: transparent; }

.c0 { fill: var(--c0); } .s0 { stroke: var(--c0); }
.c1 { fill: var(--c1); } .s1 { stroke: var(--c1); }
.c2 { fill: var(--c2); } .s2 { stroke: var(--c2); }
.c3 { fill: var(--c3); } .s3 { stroke: var(--c3); }
.c4 { fill: var(--c4); } .s4 { stroke: var(--c4); }
.c5 { fill: var(--c5); } .s5 { stroke: var(--c5); }
.c6 { fill: var(--c6); } .s6 { stroke: var(--c6); }
.c7 { fill: var(--c7); } .s7 { stroke: var(--c7); }
.on0 { fill: var(--on-primary); }

/* 逐个淡入（通用） */
.fade { animation: fade .45s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; transform-box: fill-box;
       transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: scale(1); } }

.drop { animation: drop .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }

.rise { animation: rise .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.slideL { animation: slideL .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes slideL { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }

.slideR { animation: slideR .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes slideR { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

.draw { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000);
        animation: draw .9s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.grow { animation: grow .8s cubic-bezier(.2,.85,.3,1.05) both; transform-box: fill-box;
        transform-origin: left center; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.growv { animation: growv .8s cubic-bezier(.2,.85,.3,1.05) both; transform-box: fill-box;
         transform-origin: bottom center; }
@keyframes growv { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.spin { animation: spin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }

.sweep { animation: sweep 3.2s ease-in-out infinite; }
@keyframes sweep {
  0%   { transform: translateY(0); opacity: 0; }
  12%  { opacity: .55; }
  70%  { opacity: .35; }
  100% { transform: translateY(150px); opacity: 0; }
}

.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

.glow { animation: glow 2.2s ease-in-out infinite; }
@keyframes glow {
  0%,100% { stroke-opacity: .35; stroke-width: 1.6; }
  50%     { stroke-opacity: 1; stroke-width: 3; }
}

.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

.flip { animation: flip .7s ease both; transform-box: fill-box; transform-origin: center; }
@keyframes flip { from { opacity: 0; transform: rotateX(-70deg) scale(.9); }
                  to { opacity: 1; transform: none; } }

body.paused * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .001s !important; } }

</style></head>
<body>
<div class="wrap"><div class="head"><div class="title">风险概率–影响矩阵</div><div class="cap">右上角是重点风险，必须制定应对计划；左下角只需登记并监督。</div></div><div class="stage"><svg viewBox="0 0 360 188" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><rect x="58" y="34" width="88" height="62" rx="8" class="card2" style="opacity:.55"/><rect x="146" y="34" width="88" height="62" rx="8" class="card2" style="opacity:.55"/><rect x="234" y="34" width="88" height="62" rx="8" class="card2" style="opacity:.55"/><rect x="58" y="96" width="88" height="62" rx="8" class="card2" style="opacity:.55"/><rect x="146" y="96" width="88" height="62" rx="8" class="card2" style="opacity:.55"/><rect x="234" y="96" width="88" height="62" rx="8" class="card2" style="opacity:.55"/><g class="pop" style="animation-delay:0.12s"><rect x="61" y="37" width="82" height="56" rx="8" class="c5" opacity=".16"/><rect x="61" y="37" width="82" height="56" rx="8" class="s5" fill="none" style="opacity:.6"/><text class="lbl" x="102.0" y="54" text-anchor="middle">可接受</text><text class="lbl-s" x="102.0" y="74" text-anchor="middle">登记监督</text></g><g class="pop" style="animation-delay:0.22s"><rect x="149" y="37" width="82" height="56" rx="8" class="c1" opacity=".16"/><rect x="149" y="37" width="82" height="56" rx="8" class="s1" fill="none" style="opacity:.6"/><text class="lbl" x="190.0" y="54" text-anchor="middle">中等</text><text class="lbl-s" x="190.0" y="74" text-anchor="middle">列入观察、指定责任人</text></g><g class="pop" style="animation-delay:0.32s"><rect x="237" y="37" width="82" height="56" rx="8" class="c3" opacity=".16"/><rect x="237" y="37" width="82" height="56" rx="8" class="s3" fill="none" style="opacity:.6"/><text class="lbl" x="278.0" y="54" text-anchor="middle">重点风险</text><text class="lbl-s" x="278.0" y="74" text-anchor="middle">制定应对计划、预留应急</text><text class="lbl-s" x="278.0" y="85" text-anchor="middle">储备</text></g><g class="pop" style="animation-delay:0.42s"><rect x="61" y="99" width="82" height="56" rx="8" class="c1" opacity=".16"/><rect x="61" y="99" width="82" height="56" rx="8" class="s1" fill="none" style="opacity:.6"/><text class="lbl" x="102.0" y="116" text-anchor="middle">需关注</text><text class="lbl-s" x="102.0" y="136" text-anchor="middle">触发器监控</text></g><g class="pop" style="animation-delay:0.52s"><rect x="149" y="99" width="82" height="56" rx="8" class="c3" opacity=".16"/><rect x="149" y="99" width="82" height="56" rx="8" class="s3" fill="none" style="opacity:.6"/><text class="lbl" x="190.0" y="116" text-anchor="middle">较高</text><text class="lbl-s" x="190.0" y="136" text-anchor="middle">制定应对、考虑应急费用</text></g><g class="pop" style="animation-delay:0.62s"><rect x="237" y="99" width="82" height="56" rx="8" class="c4" opacity=".16"/><rect x="237" y="99" width="82" height="56" rx="8" class="s4" fill="none" style="opacity:.6"/><text class="lbl" x="278.0" y="116" text-anchor="middle">致命风险</text><text class="lbl-s" x="278.0" y="136" text-anchor="middle">上报、制定应急计划、必</text><text class="lbl-s" x="278.0" y="147" text-anchor="middle">要时变更范围</text></g><text class="lbl-s" x="102.0" y="24" text-anchor="middle">低影响</text><text class="lbl-s" x="190.0" y="24" text-anchor="middle">中影响</text><text class="lbl-s" x="278.0" y="24" text-anchor="middle">高影响</text><text class="lbl-s" x="50" y="69.0" text-anchor="end">低概率</text><text class="lbl-s" x="50" y="131.0" text-anchor="end">高概率</text><text class="num" x="190.0" y="176" text-anchor="middle">影响 →</text><text class="num" x="14" y="96.0" text-anchor="middle" transform="rotate(-90 14 96.0)">概率 ↑</text></svg></div><div class="bar"><div class="steps"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="sp"></div><span class="btn" id="play">暂停</span><span class="btn" id="replay">重播</span></div></div>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var body = document.body;
  var btn = document.getElementById('play');
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));

  function replay() {
    // 复制一份节点，强制重启动画
    var clone = stage.cloneNode(true);
    stage.parentNode.replaceChild(clone, stage);
    stage = clone;
    bind();
    body.classList.remove('paused');
    if (btn) btn.textContent = '暂停';
    mark(0);
  }

  function bind() {
    if (!btn) return;
    btn.onclick = function () {
      var paused = body.classList.toggle('paused');
      btn.textContent = paused ? '播放' : '暂停';
    };
  }

  function mark(i) {
    dots.forEach(function (d, k) { d.classList.toggle('on', k === i); });
  }

  if (dots.length) {
    var step = Math.max(1200, Math.round(dots.length * 900));
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % dots.length;
      mark(idx);
    }, step);
  }

  var rb = document.getElementById('replay');
  if (rb) rb.onclick = replay;

  bind();
})();
</script>
</body></html>
