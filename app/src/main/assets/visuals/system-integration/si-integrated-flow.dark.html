<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>整体变更控制：项目的总闸门</title>
<style>
:root {
  --bg: #12161C;
  --panel: #1C222C;
  --panel2: #262E3A;
  --line: #394455;
  --text: #E8EEF6;
  --muted: #A9B7C9;
  --primary: #7FA5FF;
  --on-primary: #0B1017;
  --accent: #33D3BC;
  --on-accent: #07201D;
  --warn: #FFB15C;
  --on-warn: #2A1804;
  --danger: #FF7276;
  --on-danger: #2B0709;
  --c0: #7FA5FF;
  --c1: #33D3BC;
  --c2: #B49BFF;
  --c3: #FFB15C;
  --c4: #FF7276;
  --c5: #59C7E8;
  --c6: #D9BC72;
  --c7: #A6B8FF;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC",
               "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  display: flex; flex-direction: column;
}
/* 注意：这里不能用 height:100% 的链式高度。
   Android WebView 里 flex 容器分不到确定高度时，SVG 的 height:100% 会塌成 0，
   整张图就看不见了（标题和底栏还在，图不见了）。
   改成 min-height + height:auto，SVG 按 viewBox 的固有比例随宽度缩放，任何环境都稳。 */
.wrap { display: flex; flex-direction: column; min-height: 100vh; }
.head { padding: 10px 14px 4px 14px; }
.title {
  font-size: 17px; font-weight: 700; line-height: 1.35; color: var(--text);
}
.cap {
  font-size: 12.5px; line-height: 1.5; color: var(--muted); margin-top: 3px;
}
.stage { flex: 1 1 auto; min-height: 200px; position: relative;
         display: flex; align-items: center; justify-content: center; }
.stage svg { display: block; width: 100%; height: auto; }
.bar {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 14px 8px 14px;
}
.bar .sp { flex: 1 1 auto; }
.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 999px; padding: 4px 12px; font-size: 12px; line-height: 1.6;
  cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
}
.btn:active { background: var(--panel2); }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line); transition: background .25s, transform .25s;
}
.dot.on { background: var(--primary); transform: scale(1.35); }

/* 通用图元。字号是 fit_viewbox 估宽的兜底依据：改这里要同步改 CLASS_FONT。 */
.lbl  { font-size: 13.5px; font-weight: 600; fill: var(--text); }
.lbl-s{ font-size: 11.5px; font-weight: 500; fill: var(--muted); }
.lbl-w{ font-size: 13.5px; font-weight: 700; fill: var(--on-primary); }
.num  { font-size: 11px; font-weight: 700; fill: var(--muted); }
.card { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
.card2{ fill: var(--panel2); stroke: var(--line); stroke-width: 1; }
.edge { stroke: var(--line); stroke-width: 1.6; fill: none; }
.dash { stroke-dasharray: 5 5; animation: dash 1.1s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -20; } }
.hit  { fill: transparent; }

.c0 { fill: var(--c0); } .s0 { stroke: var(--c0); }
.c1 { fill: var(--c1); } .s1 { stroke: var(--c1); }
.c2 { fill: var(--c2); } .s2 { stroke: var(--c2); }
.c3 { fill: var(--c3); } .s3 { stroke: var(--c3); }
.c4 { fill: var(--c4); } .s4 { stroke: var(--c4); }
.c5 { fill: var(--c5); } .s5 { stroke: var(--c5); }
.c6 { fill: var(--c6); } .s6 { stroke: var(--c6); }
.c7 { fill: var(--c7); } .s7 { stroke: var(--c7); }
.on0 { fill: var(--on-primary); }

/* 逐个淡入（通用） */
.fade { animation: fade .45s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.pop { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; transform-box: fill-box;
       transform-origin: center; }
@keyframes pop { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: scale(1); } }

.drop { animation: drop .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes drop { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }

.rise { animation: rise .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

.slideL { animation: slideL .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes slideL { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }

.slideR { animation: slideR .55s cubic-bezier(.2,.85,.3,1.05) both; }
@keyframes slideR { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

.draw { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000);
        animation: draw .9s ease forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.grow { animation: grow .8s cubic-bezier(.2,.85,.3,1.05) both; transform-box: fill-box;
        transform-origin: left center; }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.growv { animation: growv .8s cubic-bezier(.2,.85,.3,1.05) both; transform-box: fill-box;
         transform-origin: bottom center; }
@keyframes growv { from { transform: scaleY(0); } to { transform: scaleY(1); } }

.spin { animation: spin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }

.sweep { animation: sweep 3.2s ease-in-out infinite; }
@keyframes sweep {
  0%   { transform: translateY(0); opacity: 0; }
  12%  { opacity: .55; }
  70%  { opacity: .35; }
  100% { transform: translateY(150px); opacity: 0; }
}

.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

.glow { animation: glow 2.2s ease-in-out infinite; }
@keyframes glow {
  0%,100% { stroke-opacity: .35; stroke-width: 1.6; }
  50%     { stroke-opacity: 1; stroke-width: 3; }
}

.blink { animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: .25; } 50% { opacity: 1; } }

.flip { animation: flip .7s ease both; transform-box: fill-box; transform-origin: center; }
@keyframes flip { from { opacity: 0; transform: rotateX(-70deg) scale(.9); }
                  to { opacity: 1; transform: none; } }

body.paused * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .001s !important; } }

</style></head>
<body>
<div class="wrap"><div class="head"><div class="title">整体变更控制：项目的总闸门</div><div class="cap">所有变更请求汇总到整体变更控制，评估后决定批准、否决或推迟。</div></div><div class="stage"><svg viewBox="-19.0 -10.0 395.0 218.0" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="var(--line)"/></marker></defs><g class="pop" style="animation-delay:0.10s"><rect x="-6.0" y="22" width="78" height="54" rx="9" class="c0" opacity="0.9"/><text class="on0" x="33.0" y="44" text-anchor="middle" style="font-size:12.5px;font-weight:700">提出变更请求</text><text style="fill:rgba(255,255,255,.92);font-size:10.5px" class="lbl-s" x="33.0" y="58" text-anchor="middle">任一干系人可提出</text></g><path class="edge s0" d="M75.0,49.0 L89.0,49.0" marker-end="url(#ah)"/><g class="pop" style="animation-delay:0.24s"><rect x="92.0" y="22" width="78" height="54" rx="9" class="c1" opacity="0.9"/><text class="on0" x="131.0" y="44" text-anchor="middle" style="font-size:12.5px;font-weight:700">综合评估</text><text style="fill:rgba(255,255,255,.92);font-size:10.5px" class="lbl-s" x="131.0" y="58" text-anchor="middle">对整体项目影响</text></g><path class="edge s0" d="M173.0,49.0 L187.0,49.0" marker-end="url(#ah)"/><g class="pop" style="animation-delay:0.38s"><rect x="190.0" y="22" width="78" height="54" rx="9" class="c2" opacity="0.9"/><text class="on0" x="229.0" y="44" text-anchor="middle" style="font-size:12.5px;font-weight:700">批准或否决</text><text style="fill:rgba(255,255,255,.92);font-size:10.5px" class="lbl-s" x="229.0" y="58" text-anchor="middle">CCB / 项目经理</text></g><path class="edge s0" d="M271.0,49.0 L285.0,49.0" marker-end="url(#ah)"/><g class="pop" style="animation-delay:0.52s"><rect x="288.0" y="22" width="78" height="54" rx="9" class="c3" opacity="0.9"/><text class="on0" x="327.0" y="44" text-anchor="middle" style="font-size:12.5px;font-weight:700">组织实施</text><text style="fill:rgba(255,255,255,.92);font-size:10.5px" class="lbl-s" x="327.0" y="58" text-anchor="middle">更新基准与计划</text></g><path class="edge" d="M366.0,49.0 C380.0,49.0 380.0,105.0 360.0,105.0" marker-end="url(#ah)"/><g class="pop" style="animation-delay:0.66s"><rect x="141.0" y="126" width="78" height="54" rx="9" class="c4" opacity="0.9"/><text class="on0" x="180.0" y="148" text-anchor="middle" style="font-size:12.5px;font-weight:700">监督与收尾</text><text style="fill:rgba(255,255,255,.92);font-size:10.5px" class="lbl-s" x="180.0" y="162" text-anchor="middle">归档并总结</text></g></svg></div><div class="bar"><div class="steps"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="sp"></div><span class="btn" id="play">暂停</span><span class="btn" id="replay">重播</span></div></div>
<script>
(function () {
  var stage = document.querySelector('.stage');
  var body = document.body;
  var btn = document.getElementById('play');
  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));

  function replay() {
    // 复制一份节点，强制重启动画
    var clone = stage.cloneNode(true);
    stage.parentNode.replaceChild(clone, stage);
    stage = clone;
    bind();
    body.classList.remove('paused');
    if (btn) btn.textContent = '暂停';
    mark(0);
  }

  function bind() {
    if (!btn) return;
    btn.onclick = function () {
      var paused = body.classList.toggle('paused');
      btn.textContent = paused ? '播放' : '暂停';
    };
  }

  function mark(i) {
    dots.forEach(function (d, k) { d.classList.toggle('on', k === i); });
  }

  if (dots.length) {
    var step = Math.max(1200, Math.round(dots.length * 900));
    var idx = 0;
    setInterval(function () {
      idx = (idx + 1) % dots.length;
      mark(idx);
    }, step);
  }

  var rb = document.getElementById('replay');
  if (rb) rb.onclick = replay;

  bind();
})();
</script>
</body></html>
