name: 校验题库

on:
  push:
    branches: [main]
    paths:
      - 'question-bank/**'
      - 'tools/**'
      - 'app/src/main/assets/**'
      - 'app/src/main/java/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/validate-bank.yml'
  pull_request:
    paths:
      - 'question-bank/**'
      - 'tools/**'
      - 'app/src/**'
      - 'gradle/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 校验题库 JSON（字段、答案、解析长度、id 唯一）
        run: python tools/validate_bank.py --all

      - name: 重建索引与内置种子并检查是否一致
        run: |
          python tools/build_index.py
          if ! git diff --quiet -- question-bank/index.json app/src/main/assets/seed; then
            echo "::error::index.json 或内置种子与题库不一致，请运行 python tools/build_index.py 后提交"
            git diff -- question-bank/index.json app/src/main/assets/seed | head -60
            exit 1
          fi

      - name: 逐知识点精讲覆盖率自检（每个知识点都要有一句话精讲）
        run: |
          python tools/kp_notes_pipeline.py coverage

      - name: 答案与 AI 深度解析首句一致性自检
        run: |
          python tools/check_ai_consistency.py

      - name: UI 契约自检（文字不许被省略、路由齐全、科目作用域统一）
        run: |
          python tools/ui_contract_check.py

      - name: 题库规模自检
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path('question-bank')
          total = 0
          expanded = False
          for exam_dir in sorted(p for p in root.iterdir() if p.is_dir()):
              files = sorted(exam_dir.glob('v*.json'))
              if not files:
                  continue
              data = json.loads(files[-1].read_text(encoding='utf-8'))
              n = len(data.get('questions', []))
              total += n
              if files[-1].name != 'v1.json':
                  expanded = True
              print(f"{exam_dir.name}: {n} questions ({files[-1].name})")
          print(f"TOTAL: {total}")
          if expanded and total < 2000:
              print(f"::error::扩版后的题库总量 {total} < 2000")
              sys.exit(1)
          if not expanded:
              print("::notice::当前仍是 v1 题库，扩版进行中，规模门槛暂不强制")
          PY

  unit-test:
    name: 单元测试与界面测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: 安装所需 Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: 跑单元测试与 Compose 界面测试
        run: ./gradlew testDebugUnitTest --console=plain
